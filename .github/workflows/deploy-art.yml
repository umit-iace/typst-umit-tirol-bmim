name: Deploy to GitHub Artifacts

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick
          # fonts of the template in fixed versions, the tests use them only
          # (scripts/run_tests.sh), the examples as system fonts
          scripts/fonts.sh
          mkdir -p ~/.fonts
          cp fonts/*.otf fonts/*.ttf ~/.fonts/
          fc-cache -f

      - name: Setup typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: latest

      - name: Determine and check package metadata
        run: |
          . scripts/setup @local

      - name: Run tests
        run: scripts/run_tests.sh

      - name: Build Examples
        run: |
          shopt -s extglob
          mkdir -p build_output
          cd scripts/
          ./build_examples.sh
          for f in ../example/!(*test_signature).pdf; do mv "$f" "../build_output/bmim-$(basename "$f")"; done

      - name: Upload Artifacts
        id: deployment
        uses: actions/upload-artifact@v4
        with:
          name: BMIM-Pdf
          path: build_output/

